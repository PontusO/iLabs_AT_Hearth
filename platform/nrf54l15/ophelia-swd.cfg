# openocd config for the harness's SWD reset on the Ophelia-IV carrier
# (test/mt_regression.py --openocd-config, steps 2.8, 2.13 and 2.14).
#
# The C6 rig's built-in argv resets an RP2350, because there the probe is
# on the Challenger's bridge and the bridge sketch's setup() pulses the
# C6's reset line. This carrier has no such indirection: the Raspberry Pi
# Debug Probe is wired to the nRF54L15's own SWD, so openocd resets the
# module itself. That is the warm, non-factory reboot TESTING.md 2.8 asks
# for: the ZMS settings partition survives it, so the fabric, the dataset
# and the composition do too (measured 2026-09-21).
#
# The `adapter serial` line is a BENCH fact, not a board fact, and it has
# to be here: this bench carries two CMSIS-DAP probes (E6617458830D5634 on
# the Ophelia, E661745883698A36 on the MGM240P), and
# `interface/cmsis-dap.cfg` on its own picks whichever enumerates first.
# Both answer SWD with a Cortex-M33, so the wrong one connects happily and
# resets the wrong board with no error at all. Verified 2026-09-21: through
# this serial openocd reports `SWD DPIDR 0x6ba02477` and
# `[nrf54l.cpu] Cortex-M33 r1p0`, and the module answered `+MTREADY` 1.2 s
# after `reset run` on a port held open across the reset. Change it for
# another bench.
#
# `reset_config none` because SRST is not wired out to the probe here: the
# module's reset line belongs to the CPico bridge (DTR), not to the Debug
# Probe. `reset run` therefore goes through the Cortex-M33's own
# SYSRESETREQ, which `target/nordic/nrf54l.cfg` selects for this part.
#
# pyocd is this platform's SWD tool everywhere else (the bootloader
# install, README "One-time SWD install"). openocd is used here only
# because the harness's reset argv is openocd's, and a second tool in the
# reset path would be a harness fork. Never add a mass erase, an APPROTECT
# write or any flash command to this file: it resets, nothing more.

source [find interface/cmsis-dap.cfg]
adapter serial E6617458830D5634
transport select swd
reset_config none
source [find target/nordic/nrf54l.cfg]
