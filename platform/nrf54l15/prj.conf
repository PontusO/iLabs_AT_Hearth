CONFIG_SERIAL=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
# hearth_link_read (hearth_port_zephyr.c) drains the AT UART through the
# nrfx UARTE interrupt-driven API into a ring buffer, not uart_poll_in:
# this driver only stages a single RX byte at a time (re-armed per byte
# inside uart_fifo_read), and a poll loop with a k_msleep between polls
# loses bytes arriving during the sleep.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y
CONFIG_LOG=y
CONFIG_REBOOT=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_DYNAMIC_THREAD_POOL_SIZE=2

# Persistent KV (hearth_kv_*, platform/nrf54l15/port/hearth_port_zephyr.c):
# settings over the ZMS backend, on the settings_storage partition.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y
