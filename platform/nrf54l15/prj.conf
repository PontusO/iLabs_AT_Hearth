CONFIG_SERIAL=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
# hearth_link_read (hearth_port_zephyr.c) drains the AT UART through the
# nrfx UARTE interrupt-driven API into a ring buffer, not uart_poll_in:
# this driver only stages a single RX byte at a time (re-armed per byte
# inside uart_fifo_read), and a poll loop with a k_msleep between polls
# loses bytes arriving during the sleep.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y
CONFIG_LOG=y
CONFIG_REBOOT=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_DYNAMIC_THREAD_POOL_SIZE=2

# Persistent KV (hearth_kv_*, platform/nrf54l15/port/hearth_port_zephyr.c):
# settings over the ZMS backend, on the settings_storage partition.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y

# Matter core (spec section 7). CHIP's Kconfig.defaults pulls in BT,
# OpenThread, and the ZMS settings backend for this SoC on its own.
CONFIG_CHIP=y
CONFIG_STD_CPP17=y
CONFIG_CHIP_PROJECT_CONFIG="src/chip_project_config.h"
# Dev credentials this round: test DAC/VID/PID from SDK defaults, no
# factory data partition content (spec section 6).
CONFIG_CHIP_FACTORY_DATA_NONE=y
# Host-driven serial update is the update story (FIRMWARE_UPDATE_SPEC),
# deliberately not Matter OTA; NFC onboarding has no hardware here.
CONFIG_CHIP_OTA_REQUESTOR=n
CONFIG_CHIP_NFC_ONBOARDING_PAYLOAD=n
CONFIG_BT_DEVICE_NAME="Hearth"
# The CHIP_BOOTLOADER choice defaults to CHIP_BOOTLOADER_MCUBOOT on this
# SoC, which unconditionally selects IMG_MANAGER; that pulls in mcuboot's
# bootutil_public.c compiled against this image's own Kconfig namespace,
# where it expects a secondary (OTA) slot our single-slot partition map
# does not have. We do not need CHIP to know about the bootloader at all:
# the locked MCUboot install and serial recovery (platform/nrf54l15/README)
# are independent of Matter, and Matter OTA is off (above), so nothing here
# goes through CHIP's own image-management path.
CONFIG_CHIP_BOOTLOADER_NONE=y
# CHIP_CRYPTO_PSA defaults to y in the CHIP module's own Kconfig.defaults
# (sourced from platform/nrf54l15/Kconfig), but that "default y" sits
# inside the file's own "if CHIP ... endif # CHIP" body (chip-module/
# Kconfig.defaults:21-606, the default itself at :385-386). This build
# passed through a window where sysbuild forced the app image's own
# CONFIG_CHIP to n regardless of what this file asked for (see
# sysbuild.conf's SB_CONFIG_MATTER=y fix, same commit), and while that
# held, CHIP_CRYPTO_PSA's default never took hold: with CHIP=n the "if
# CHIP" body simply is not reachable, default included. Kept explicit
# here rather than trusted to the default even now that CHIP=y holds,
# since nothing about that history is worth re-litigating on every prj.conf
# read. Without it CHIP falls back to its legacy mbedTLS crypto backend,
# and this SoC's nrf_security build (CRACEN-first, PSA-only) does not
# expose the legacy mbedTLS API surface CHIP expects (mbedtls_ecp_muladd
# and similar go undeclared, fails to compile).
CONFIG_CHIP_CRYPTO_PSA=y

# The NCS Matter common Kconfig (platform/nrf54l15/Kconfig) declares this
# string symbol with no default; every NCS Matter sample's prj.conf sets it
# to its own ZAP file, so the value is set here too even though this
# platform's CMakeLists.txt passes the ZAP_FILE path to
# chip_configure_data_model() directly rather than through this symbol.
CONFIG_NCS_SAMPLE_MATTER_ZAP_FILE_PATH="${APPLICATION_CONFIG_DIR}/src/default_zap/hearth.zap"
