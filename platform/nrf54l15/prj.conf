CONFIG_SERIAL=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
# hearth_link_read (hearth_port_zephyr.c) drains the AT UART through the
# nrfx UARTE interrupt-driven API into a ring buffer, not uart_poll_in:
# this driver only stages a single RX byte at a time (re-armed per byte
# inside uart_fifo_read), and a poll loop with a k_msleep between polls
# loses bytes arriving during the sleep.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y
CONFIG_LOG=y
CONFIG_REBOOT=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_DYNAMIC_THREAD_POOL_SIZE=2

# Persistent KV (hearth_kv_*, platform/nrf54l15/port/hearth_port_zephyr.c):
# settings over the ZMS backend, on the settings_storage partition.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y
# Memory reclaim round A. CHIP's own Kconfig.defaults sets this to 512
# (chip-module/Kconfig.defaults:91-92) against a Zephyr default of 128, and
# every entry costs 8 bytes of RAM (zephyr/include/zephyr/fs/zms.h:66), so
# 512 buckets is 4,096 B. The settings_storage partition is 32 KB and holds
# the heartbeat KV store plus Matter persistence: a bounded, modest key
# count, nothing like the hundreds a 512-bucket table implies.
#
# What a smaller cache actually costs (fix round M5, corrected: it is not
# what a "miss" costs). A slot holding ZMS_LOOKUP_CACHE_NO_ADDR makes
# zms_read_hist() answer -ENOENT immediately with no scan at all
# (zms.c:1757-1761), which is correct because an empty slot proves no id
# hashing to it was ever written. The cost is a COLLISION: a slot holds the
# newest ATE address among all ids hashing to it, and zms_find_ate_with_id()
# then walks backwards from there. That backwards walk is also what keeps a
# smaller cache correct: every colliding id's latest ATE stays reachable
# however many ids share a slot, so a collision costs scan length and never
# a failure or a lost write (zms.c:120, :145, :175-178, :294, :428, :1090,
# :1160, :1476-1487, :1609, :1757), on a boot path that is not
# latency-sensitive.
#
# CONFIG_ZMS_LOOKUP_CACHE_FOR_SETTINGS=y here (CHIP's chip-module/Kconfig:25
# implies it for SOC_FLASH_NRF_RRAM), and that hash reserves its low two bits
# for the name/data and linked-list discriminators, so `% 64` leaves four
# bits of settings-key discrimination, sixteen distinguishable keys, against
# seven bits and 128 at a cache size of 512. That is the number a bench
# observation of settings-read latency should be measured against.
CONFIG_ZMS_LOOKUP_CACHE_SIZE=64

# Matter core (spec section 7). CHIP's Kconfig.defaults pulls in BT,
# OpenThread, and the ZMS settings backend for this SoC on its own.
CONFIG_CHIP=y
CONFIG_STD_CPP17=y
CONFIG_CHIP_PROJECT_CONFIG="src/chip_project_config.h"
# Dev credentials this round: test DAC/VID/PID from SDK defaults, no
# factory data partition content (spec section 6).
CONFIG_CHIP_FACTORY_DATA_NONE=y
# The Matter OTA requestor is on, for the FOTA relay (docs:
# 2026-09-07-fota-design). The requestor downloads and the HOST stores and
# flashes: the co-processor has no second slot and never writes its own image
# (FIRMWARE_UPDATE_SPEC stays the update story, this only changes where the
# bundle comes from). So the single MCUboot slot stays, none of the DFU
# machinery NCS implies below is wanted, and NCS's own ota_util.cpp is not in
# CMakeLists.txt: the port defines InitBasicOTARequestor() and
# OtaConfirmNewImage() itself, in port/hearth_ota_nrf.cpp.
CONFIG_CHIP_OTA_REQUESTOR=y
# Nothing reboots on apply here. The host is told over AT (+MTOTA:APPLY) and
# reboots the co-processor itself when it has flashed the bundle.
CONFIG_CHIP_OTA_REQUESTOR_REBOOT_ON_APPLY=n
# CHIP_OTA_REQUESTOR *implies* all five of these (chip-module/Kconfig:90-97),
# and an imply loses to an explicit assignment here, which is why they are
# written down. They exist to write a downloaded image into an MCUboot
# secondary slot; this partition map has none, and the host is the image
# store. The code that would have used them, CHIP's own
# nrfconnect/OTAImageProcessorImpl.cpp, is compiled by the gn build whenever
# the requestor is on but is never instantiated, so its object file is not
# pulled out of libCHIP.a and none of these calls reach the link.
#
# Letting them stand at the implied y instead was tried first and does not
# build: IMG_MANAGER drags in mcuboot's bootutil_public.c and DFU_TARGET
# drags in dfu_target_mcuboot.c, both of which want a secondary slot
# (PM_MCUBOOT_SECONDARY_ID, PM_MCUBOOT_SECONDARY_ADDRESS) that a single-app
# partition map does not define. The one symbol OTAImageProcessorImpl.cpp
# genuinely needs, CONFIG_UPDATEABLE_IMAGE_NUMBER, is supplied by this
# platform's own Kconfig instead; the comment there has the whole story.
CONFIG_DFU_TARGET=n
CONFIG_DFU_MULTI_IMAGE=n
CONFIG_STREAM_FLASH=n
CONFIG_IMG_MANAGER=n
# NFC onboarding has no hardware here.
CONFIG_CHIP_NFC_ONBOARDING_PAYLOAD=n
CONFIG_BT_DEVICE_NAME="Hearth"
# An uncommissioned Hearth opens its commissioning window at boot and
# advertises. That is the product contract every other port already keeps
# (TESTING.md 2.1: "a fresh device opens a window automatically", which is
# what AT+MTSTATE? answering 1 and the boot +MTEVT:0 both mean), and it is
# what AT_MT_SPEC.md 3.11's boot event describes.
#
# It is written down HERE because this is the one platform where it is not
# the default. CHIP's CHIP_DEVICE_CONFIG_ENABLE_PAIRING_AUTOSTART is 1 on
# the ESP32 and EFR32 platforms, so the C6 and the MGM240P get it without
# asking; the nrfconnect platform binds it to this Kconfig and NCS leaves
# the Kconfig off (modules/lib/matter/src/platform/nrfconnect/
# CHIPDevicePlatformConfig.h:200-202). Nordic's own Matter samples and
# applications all set it back to y in their prj.conf, for the same reason.
#
# Without it Server::Init() opens no window on an uncommissioned boot, so
# AT+MTSTATE? answers 0 after AT+MTRESET, no +MTEVT:0 is ever raised at
# boot (mt_chip_events_after_ready()'s replay reads a closed window and
# emits nothing, correctly), and a controller has nothing to pair with
# until the host sends AT+MTCOMMISSION. Measured on the bench 2026-09-21,
# which is where it was found: harness Phase 2 cannot get past 2.3 on this
# port without it. See README "Events (+MTEVT)".
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y
# The CHIP_BOOTLOADER choice defaults to CHIP_BOOTLOADER_MCUBOOT on this
# SoC, which unconditionally selects IMG_MANAGER; that pulls in mcuboot's
# bootutil_public.c compiled against this image's own Kconfig namespace,
# where it expects a secondary (OTA) slot our single-slot partition map
# does not have. We do not need CHIP to know about the bootloader at all:
# the locked MCUboot install and serial recovery (platform/nrf54l15/README)
# are independent of Matter, and the requestor above hands every block to
# the host rather than to flash, so nothing here goes through CHIP's own
# image-management path.
CONFIG_CHIP_BOOTLOADER_NONE=y
# CHIP_CRYPTO_PSA defaults to y in the CHIP module's own Kconfig.defaults
# (sourced from platform/nrf54l15/Kconfig), but that "default y" sits
# inside the file's own "if CHIP ... endif # CHIP" body (chip-module/
# Kconfig.defaults:21-606, the default itself at :385-386). This build
# passed through a window where sysbuild forced the app image's own
# CONFIG_CHIP to n regardless of what this file asked for (see
# sysbuild.conf's SB_CONFIG_MATTER=y fix, same commit), and while that
# held, CHIP_CRYPTO_PSA's default never took hold: with CHIP=n the "if
# CHIP" body simply is not reachable, default included. Kept explicit
# here rather than trusted to the default even now that CHIP=y holds,
# since nothing about that history is worth re-litigating on every prj.conf
# read. Without it CHIP falls back to its legacy mbedTLS crypto backend,
# and this SoC's nrf_security build (CRACEN-first, PSA-only) does not
# expose the legacy mbedTLS API surface CHIP expects (mbedtls_ecp_muladd
# and similar go undeclared, fails to compile).
CONFIG_CHIP_CRYPTO_PSA=y

# Thread role and mesh sizing, memory reclaim round A.
#
# FTD is stated here rather than inherited. Until this round the build was
# a full Thread device only because OPENTHREAD_FTD is listed first in the
# Kconfig choice nobody set (zephyr/modules/openthread/Kconfig.thread:42-51),
# which made a 9 KB product decision look like an accident in every config
# dump. Ruling DE412: the router role is a KEPT product capability, the
# device must remain able to route, so the line is written down. MTD would
# return about 9,121 B of ot::Instance plus a 4 KB message-pool floor and
# is deliberately not taken.
CONFIG_OPENTHREAD_FTD=y
# 16 rather than the Zephyr default of 32 (Kconfig.thread:62-65), at 200 B
# of ot::Instance per child. Ruling DE412 fixed the number at 16 and NOT 8:
# the router role stays, and sixteen children is generous for a device of
# this kind. Only meaningful while FTD.
CONFIG_OPENTHREAD_MAX_CHILDREN=16

# The NCS Matter common Kconfig (platform/nrf54l15/Kconfig) declares this
# string symbol with no default; every NCS Matter sample's prj.conf sets it
# to its own ZAP file, so the value is set here too even though this
# platform's CMakeLists.txt passes the ZAP_FILE path to
# chip_configure_data_model() directly rather than through this symbol.
CONFIG_NCS_SAMPLE_MATTER_ZAP_FILE_PATH="${APPLICATION_CONFIG_DIR}/src/default_zap/hearth.zap"
