SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_SINGLE_APP=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="${APP_DIR}/keys/hearth_dev_p256.pem"

# Sysbuild gates CONFIG_CHIP on this: nrf/sysbuild/CMakeLists.txt forces
# CONFIG_CHIP=n on the app image unless SB_CONFIG_MATTER=y here, no matter
# what prj.conf says. SB_CONFIG_MATTER_OTA forces CONFIG_CHIP_OTA_REQUESTOR
# BOTH WAYS on the app image (sysbuild/CMakeLists.txt:832-837, a
# set_config_bool y in one branch and n in the other), so prj.conf's
# CONFIG_CHIP_OTA_REQUESTOR=y is only what it says while this is y. The FOTA
# relay needs the requestor, so it is y.
#
# This does NOT turn the app into a self-flashing device and it does not
# touch the bootloader mode: single-app MCUboot below stays, and the DFU
# machinery the requestor implies is switched off in prj.conf. What
# SB_CONFIG_MATTER_OTA additionally brings is CONFIG_CHIP_OTA_IMAGE_BUILD on
# the app image, a build step that wraps the signed application in a Matter
# OTA image header. That artifact is a by-product here: the bundle a host
# serves to this device is the host's business, not this build's.
SB_CONFIG_MATTER=y
SB_CONFIG_MATTER_OTA=y
