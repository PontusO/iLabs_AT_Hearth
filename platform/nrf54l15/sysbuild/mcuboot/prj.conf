# MCUboot's own prj.conf, copied verbatim below this header.
#
# WHY THIS FILE EXISTS AT ALL, because deleting it looks free and is not.
# Sysbuild redirects a child image's APPLICATION_CONFIG_DIR to
# <app>/sysbuild/<image>/ the moment that directory exists
# (zephyr/share/sysbuild/cmake/modules/sysbuild_extensions.cmake, the
# sysbuild_image_name_conf_dir branch). That directory is what makes
# boards/<board>.overlay work for the MCUboot image, which is the whole point
# of it here: the serial-recovery UART has to be per-board. The cost is that
# the redirect ALSO moves where Zephyr looks for the image's prj.conf, and
# MCUboot's own bootloader/mcuboot/boot/zephyr/prj.conf stops being read.
# Without this file the configure fails outright ("No prj.conf file(s) was
# found"), which is at least loud; the quiet failure would have been shipping
# a bootloader built without PICOLIBC, CBPRINTF_NANO or MCUboot's own log
# settings. The socs/ fragment beside this file is the same story with a
# silent failure instead of a loud one.
#
# WHO ELSE DOES THIS, since the answer is the argument for the choice and an
# earlier version of this header got it wrong. Copying upstream's prj.conf
# and carrying socs/ is what the SDK's own DFU samples do
# (nrf/samples/dfu/compressed_update, nrf/samples/bluetooth/mesh/dfu/target
# and .../distributor). Nordic's Matter samples take the other route: their
# sysbuild/mcuboot/prj.conf is NOT a copy of upstream's, it is a bespoke
# size-trimmed configuration that re-adds CONFIG_LTO and
# CONFIG_ISR_TABLES_LOCAL_DECLARATION itself and CONFIG_BOOT_WATCHDOG_FEED=n
# in its per-board .conf, and carries no socs/ at all. Do not diff this file
# against theirs expecting agreement; they are two different conventions and
# this is the copy-based one.
#
# THIS IS A COPY, SO IT CAN GO STALE. platform/nrf54l15/CMakeLists.txt fails
# the configure if upstream's prj.conf is no longer contained verbatim in
# this file, so an NCS bump that edits it cannot pass silently. What that
# check does NOT see is a line ADDED below the verbatim block: containment is
# one-directional, deliberately, because this header is itself an addition.
# Put platform settings in sysbuild/mcuboot.conf, not here. When the check
# fires, re-copy upstream's file under this header and rebuild the bootloader
# image to see what moved.
#
# WHAT IS NOT COPIED: upstream's boot/zephyr/app.overlay, which sets
# zephyr,code-partition = &boot_partition. The redirect moves the devicetree
# lookups too, but that overlay was already not applied before this directory
# existed (sysbuild/mcuboot.overlay set mcuboot_DTC_OVERLAY_FILE, which skips
# those lookups), the bootloader's zephyr,code-partition has always come from
# the board .dts, and Partition Manager sets the link region regardless.
# Copying it would be a change, not a restoration.
#
# This platform's OWN MCUboot settings are not here. They live in
# sysbuild/mcuboot.conf, which sysbuild still applies on top as the image's
# EXTRA_CONF_FILE by a separate mechanism that the redirect does not touch,
# and which is merged after this file, so it wins.
#
# ---- verbatim copy of bootloader/mcuboot/boot/zephyr/prj.conf below -------

CONFIG_PM=n

CONFIG_MAIN_STACK_SIZE=10240

CONFIG_BOOT_SWAP_SAVE_ENCTLV=n
CONFIG_BOOT_ENCRYPT_IMAGE=n

CONFIG_BOOT_UPGRADE_ONLY=n
CONFIG_BOOT_BOOTSTRAP=n

### mbedTLS has its own heap
# CONFIG_HEAP_MEM_POOL_SIZE is not set

CONFIG_FLASH=y

### Various Zephyr boards enable features that we don't want.
# CONFIG_BT is not set
# CONFIG_I2C is not set

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
### Ensure Zephyr logging changes don't use more resources
CONFIG_LOG_DEFAULT_LEVEL=0
### Use info log level by default
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
### Decrease footprint by ~4 KB in comparison to CBPRINTF_COMPLETE=y
CONFIG_CBPRINTF_NANO=y
### Use picolibc to reduce flash usage
CONFIG_PICOLIBC=y
### Disable malloc arena because we don't need it
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0

# NCS boot banner
CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="MCUboot"
