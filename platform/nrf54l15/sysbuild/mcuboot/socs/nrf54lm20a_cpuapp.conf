# MCUboot's own SoC fragment for this part, copied verbatim below.
#
# Same reason as the prj.conf beside this directory, and the same trap with a
# worse failure mode: the sysbuild/mcuboot/ directory redirects the MCUboot
# image's APPLICATION_CONFIG_DIR here, which is what makes
# boards/<board>.overlay work for that image, and in doing so it also stops
# Zephyr from finding MCUboot's own socs/<soc>_<cluster>.conf. Losing the
# prj.conf fails the configure. Losing THIS is SILENT: the image still builds
# and still boots, without LTO, without ISR_TABLES_LOCAL_DECLARATION, with the
# RRAM write buffer at its 1-word fallback and with the watchdog feed turned
# back on. (CONFIG_NRF_RRAM_WRITE_BUFFER_SIZE counts 128-bit words, so the 32
# below is 512 bytes and the fallback 1 is 16.)
#
# platform/nrf54l15/CMakeLists.txt asks upstream what it WOULD have supplied
# for the board being built and fails the configure if the answer is not
# contained verbatim here, so neither an NCS bump nor a new SoC can pass
# silently. Containment is one-directional: a line ADDED below the verbatim
# block is not seen, so platform settings belong in sysbuild/mcuboot.conf.
#
# ---- verbatim copy below --------------------------------------------------

# Copyright (c) 2025 Nordic Semiconductor ASA
#
# SPDX-License-Identifier: Apache-2.0
#
CONFIG_BOOT_MAX_IMG_SECTORS=256

# Ensure that the SPI NOR driver is disabled by default
CONFIG_SPI_NOR=n

# TODO: below are not yet supported and need fixing
CONFIG_FPROTECT=n

CONFIG_BOOT_WATCHDOG_FEED=n
