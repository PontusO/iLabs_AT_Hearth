# MCUboot's own SoC fragment for this part, copied verbatim below.
#
# Same reason as the prj.conf beside this directory, and the same trap: the
# sysbuild/mcuboot/ directory redirects the MCUboot image's
# APPLICATION_CONFIG_DIR here, which is what makes boards/<board>.overlay
# work for that image, and in doing so it also stops Zephyr from finding
# MCUboot's own socs/<soc>_<cluster>.conf. That one is worse than the
# prj.conf, because losing it is SILENT: the image still builds and still
# boots, just without LTO, with a 1-byte RRAM write buffer and with the
# watchdog feed turned back on.
#
# platform/nrf54l15/CMakeLists.txt asks upstream what it WOULD have supplied
# for the board being built and fails the configure if the answer is not
# contained verbatim in the matching file here, so neither an NCS bump nor a
# new SoC can pass silently.
#
# ---- verbatim copy below --------------------------------------------------

# Copyright (c) 2024 Nordic Semiconductor ASA
#
# SPDX-License-Identifier: Apache-2.0
#
CONFIG_BOOT_MAX_IMG_SECTORS=256

# Ensure that the SPI NOR driver is disabled by default
CONFIG_SPI_NOR=n

CONFIG_BOOT_WATCHDOG_FEED=n

# Ensure the fastest RRAM write operations
CONFIG_NRF_RRAM_WRITE_BUFFER_SIZE=32

# Link Time Optimizations
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_LTO=y
