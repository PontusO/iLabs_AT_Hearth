# openocd config for the harness's SWD reset on the iLabs CPico carrier
# (test/mt_regression.py --openocd-config, steps 2.8, 2.13 and 2.14).
#
# The C6 rig's built-in argv resets an RP2350: there the probe is on the
# Challenger's bridge and the bridge sketch's setup() pulses the C6's reset
# line. This carrier has no such indirection. The Raspberry Pi Debug Probe
# is wired to the MGM240PA32VNA3's own SWD, so openocd resets the module
# itself, which is the same warm, non-factory reboot TESTING.md 2.8 asks
# for: NVM3 survives it, so the fabric, the dataset and the composition do
# too.
#
# The `adapter serial` line is a BENCH fact, not a board fact, and it is
# here because it has to be: this bench carries two CMSIS-DAP probes
# (E661745883698A36 on the MGM240P, E6617458830D5634 on another target),
# and `interface/cmsis-dap.cfg` on its own picks whichever enumerates
# first. Both answer SWD with a Cortex-M33, so the wrong one connects
# happily and resets the wrong board. Verified 2026-09-21 by reading
# DEVINFO through each: this serial is the one that reports
# `EFR32MG24 A620, rev 7`. Change it for another bench.
#
# `reset_config none` because SRST is not wired out to the probe here;
# `reset run` therefore goes through the Cortex-M33's own SYSRESETREQ,
# which is what produced the full boot log this carrier's README records.
# Never add an SE device erase or a debug-lock command to this file.

source [find interface/cmsis-dap.cfg]
adapter serial E661745883698A36
transport select swd
reset_config none
source [find target/silabs/xg24.cfg]
